services:
  # Backend Express Server + BullMQ Worker (Free Plan)
  - type: web
    name: reachinbox-backend
    env: node
    plan: free
    rootDir: apps/backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: SESSION_SECRET
        value: reachinbox-dev-session-secret-key-min-32-chars
      - key: JWT_SECRET
        value: reachinbox-dev-jwt-secret-key-min-32-chars

  # Frontend Next.js Web App (Free Plan)
  - type: web
    name: reachinbox-frontend
    env: node
    plan: free
    rootDir: apps/frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
