services:
  # Managed Redis Store
  - type: redis
    name: reachinbox-redis
    plan: free
    ipAllowList: []

  # Backend Express Server + BullMQ Worker
  - type: web
    name: reachinbox-backend
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run db:generate && npm run build:backend
    startCommand: npm run --prefix apps/backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        value: reachinbox-dev-session-secret-key-min-32-chars
      - key: JWT_SECRET
        value: reachinbox-dev-jwt-secret-key-min-32-chars
      - key: DATABASE_URL
        fromDatabase:
          name: reachinbox-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: reachinbox-redis
          property: connectionString
      - key: FRONTEND_URL
        fromService:
          type: web
          name: reachinbox-frontend
          property: url
      - key: BACKEND_URL
        fromService:
          type: web
          name: reachinbox-backend
          property: url
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://reachinbox-backend.onrender.com/api/auth/google/callback
      - key: SMTP_HOST
        value: smtp.ethereal.email
      - key: SMTP_PORT
        value: "587"
      - key: WORKER_CONCURRENCY
        value: "5"
      - key: MIN_SEND_DELAY_MS
        value: "2000"
      - key: MAX_EMAILS_PER_HOUR
        value: "200"

  # Frontend Next.js Web App
  - type: web
    name: reachinbox-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build:frontend
    startCommand: npm run --prefix apps/frontend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: reachinbox-backend
          property: url

databases:
  - name: reachinbox-postgres
    plan: free




