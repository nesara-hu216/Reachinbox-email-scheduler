services:
  # Backend Express Server + BullMQ Worker
  - type: web
    name: reachinbox-backend
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run db:generate && npm run build:backend
    startCommand: npm run --prefix apps/backend start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        value: reachinbox-dev-session-secret-key-min-32-chars
      - key: JWT_SECRET
        value: reachinbox-dev-jwt-secret-key-min-32-chars

  # Frontend Next.js Web App
  - type: web
    name: reachinbox-frontend
    env: node
    plan: free
    buildCommand: npm install && npm run build:frontend
    startCommand: npm run --prefix apps/frontend start
    envVars:
      - key: NODE_ENV
        value: production
